# The lab database of compose.yaml, for the stack tests and the labs. Every key is required.
db.url=jdbc:postgresql://127.0.0.1:21300/seatwave
db.ownerUser=seatwave_owner
db.ownerPasswordFile=.secrets/owner.password
db.appUser=seatwave_app
db.appPasswordFile=.secrets/app.password
# 64 connections: the hold-limit race keeps 50 transactions open at its gate at once. The tests
# open two such pools (guarded and unguarded) and two owner pools of 2, 132 connections, so
# compose.yaml sets max_connections to 200.
db.poolSize=64
db.connectTimeoutMillis=10000
# Longer than PostgreSQL's deadlock_timeout (1 s), so a deadlock is detected before a wait times out.
db.lockTimeoutMillis=2000
retry.maxAttempts=10
retry.firstBackoffMillis=2
retry.maxBackoffMillis=50
# Module 1's hold: 300 seconds.
hold.durationSeconds=300
# Must equal the argument of the trigger hold_limit_per_customer in V2 (4).
hold.maxActivePerCustomer=4
race.seatRacers=200
race.limitRacers=50
race.gatePatienceMillis=20000
